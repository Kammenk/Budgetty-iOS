# ─────────────────────────────────────────────────────────────────────────────
# Crowdin CLI — Budgetty (iOS)
# Project:  https://crowdin.com/project/budgetty
#           SAME project as the Android repo → shared Translation Memory & glossary.
# CLI:      brew install crowdin   (or  npm i -g @crowdin/cli)
#
# Credentials come from the environment — do NOT hardcode tokens in this file:
#   export CROWDIN_PROJECT_ID=<same numeric Project ID as Android>
#   export CROWDIN_PERSONAL_TOKEN=<crowdin.com → Account Settings → API token>
#
# Typical workflow:
#   crowdin push                                        # upload en source from the catalog
#   crowdin upload translations --auto-approve-imported # import the 15 existing languages
#   crowdin download                                    # write translations back into the catalog
# ─────────────────────────────────────────────────────────────────────────────

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

base_path: "."
preserve_hierarchy: true

files:
  # Localizable.xcstrings is a MULTILINGUAL String Catalog: a single file holds
  # every language. Crowdin reads `en` as the source and writes every target
  # language back into the SAME file — so source and translation are one path.
  - source: /Budgetty/Localizable.xcstrings
    translation: /Budgetty/Localizable.xcstrings

# ⚠️ After the first round-trip, verify the catalog with a SEMANTIC key-diff
#    (not git's line-diff) — the String Catalog parser can reorder or re-key.
#    If it ever mangles the file, fall back to the XLIFF flow:
#      xcodebuild -exportLocalizations -project Budgetty.xcodeproj -localizationPath ./loc
#      (upload en.xcloc's xliff as source, download each <lang>.xcloc, then)
#      xcodebuild -importLocalizations -project Budgetty.xcodeproj -localizationPath ./loc/<lang>.xcloc
